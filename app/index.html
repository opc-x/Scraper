<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Scraper">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Scraper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

/* ══════════════════════════════════════════
   设计令牌 —— 深色卡片系统，圆角 + 柔光阴影 + 弱饱和强调色
   ══════════════════════════════════════════ */
:root {
  --bg: #0b0c0f;
  --bg-elevated: #131519;
  --bg2: #16181d;
  --bg3: #1e2128;
  --bg-hover: #22262e;
  --border: rgba(255,255,255,0.07);
  --border-strong: rgba(255,255,255,0.12);
  --text: #eef0f3;
  --text2: #9096a1;
  --text3: #5b616e;

  --green: #34d399;
  --green-soft: rgba(52,211,153,0.14);
  --green-border: rgba(52,211,153,0.3);
  --indigo: #818cf8;
  --indigo-soft: rgba(129,140,248,0.14);
  --indigo-border: rgba(129,140,248,0.3);
  --amber: #fbbf24;
  --amber-soft: rgba(251,191,36,0.14);
  --amber-border: rgba(251,191,36,0.3);
  --red: #fb7185;
  --red-soft: rgba(251,113,133,0.14);
  --red-border: rgba(251,113,133,0.3);
  --blue: #38bdf8;
  --blue-soft: rgba(56,189,248,0.14);

  --radius-sm: 10px;
  --radius: 18px;
  --radius-lg: 22px;
  --radius-pill: 999px;
  --shadow-card: 0 1px 2px rgba(0,0,0,0.4), 0 8px 24px -12px rgba(0,0,0,0.55);
  --shadow-pop: 0 4px 10px -4px rgba(0,0,0,0.5);
  --nav-h: 68px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}

html, body {
  height: 100%;
  background:
    radial-gradient(1200px 600px at 15% -10%, rgba(52,211,153,0.05), transparent 55%),
    radial-gradient(900px 500px at 100% 0%, rgba(129,140,248,0.045), transparent 50%),
    var(--bg);
  color: var(--text);
  font-family: 'Inter', -apple-system, 'PingFang SC', 'SF Pro', sans-serif;
  font-feature-settings: 'tnum' 1;
  -webkit-font-smoothing: antialiased;
}

::selection { background: var(--green-soft); color: var(--text); }

/* ── Layout ── */
.screen { display: none; flex-direction: column; height: 100dvh; overflow: hidden; }
.screen.active { display: flex; animation: fade-in 0.25s var(--ease); }
@keyframes fade-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
.screen-body { flex: 1; min-width:0; overflow-y: auto; padding: 4px 18px calc(var(--nav-h) + var(--safe-bottom) + 20px); }
.screen-body::-webkit-scrollbar { display: none; }

/* ── Top bar ── */
.topbar { padding: 16px 18px 14px; padding-top: calc(env(safe-area-inset-top, 12px) + 14px); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.topbar-title { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 23px; font-weight: 800; letter-spacing: -0.02em; }
.topbar-title span { color: var(--green); }
.topbar-sub { font-size: 12.5px; color: var(--text3); margin-top: 3px; font-weight: 500; }
.domain-switch { position:relative; flex-shrink:0; }
.domain-trigger { display:flex; align-items:center; gap:8px; min-width:118px; padding:9px 11px;
  color:var(--text); background:var(--bg-elevated); border:1px solid var(--border-strong);
  border-radius:var(--radius-sm); font:700 12px inherit; cursor:pointer; text-align:left; }
.domain-trigger:hover { background:var(--bg-hover); }
.domain-trigger .domain-icon { width:22px; height:22px; display:grid; place-items:center;
  border-radius:7px; color:var(--green); background:var(--green-soft); font-size:12px; }
.domain-trigger .domain-caret { margin-left:auto; color:var(--text3); transition:transform .18s var(--ease); }
.domain-switch.open .domain-caret { transform:rotate(180deg); }
.domain-menu { position:absolute; top:calc(100% + 8px); right:0; width:210px; padding:7px;
  background:rgba(22,24,29,.98); border:1px solid var(--border-strong); border-radius:14px;
  box-shadow:0 18px 48px rgba(0,0,0,.45); z-index:100; opacity:0; visibility:hidden;
  transform:translateY(-5px); transition:opacity .16s, transform .16s var(--ease), visibility .16s; }
.domain-switch.open .domain-menu { opacity:1; visibility:visible; transform:translateY(0); }
.domain-option { width:100%; display:flex; align-items:center; gap:10px; padding:10px; border:0;
  border-radius:9px; background:transparent; color:var(--text2); font:600 12px inherit; text-align:left; }
.domain-option.active { color:var(--green); background:var(--green-soft); }
.domain-option:disabled { color:var(--text3); }
.domain-option .soon { margin-left:auto; font-size:9px; font-weight:700; color:var(--text3); }

/* ── Bottom nav ── */
.bottom-nav {
  position: fixed; bottom: 10px; left: 12px; right: 12px;
  height: var(--nav-h);
  padding-bottom: 0;
  margin-bottom: var(--safe-bottom);
  background: rgba(19,21,25,0.78);
  backdrop-filter: blur(24px) saturate(160%);
  -webkit-backdrop-filter: blur(24px) saturate(160%);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-lg);
  display: flex;
  z-index: 50;
  box-shadow: var(--shadow-card);
}
.nav-item { padding-left:2px; padding-right:2px;
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  cursor: pointer; color: var(--text3); border: none; background: none; position: relative;
  transition: color 0.2s var(--ease);
  margin: 7px 5px; border-radius: var(--radius);
}
.nav-item.active { color: var(--green); background: var(--green-soft); }
.nav-icon { font-size: 19px; line-height: 1; filter: grayscale(0.3); }
.nav-item.active .nav-icon { filter: none; }
.nav-label { font-size: 10.5px; font-weight: 600; letter-spacing: 0.2px; }

/* ── Cards / inputs ── */
.card { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 10px; box-shadow: var(--shadow-card); }
.card:last-child { margin-bottom: 0; }
.search-card { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; box-shadow: var(--shadow-card); }
.search-row { display: flex; gap: 8px; margin-bottom: 8px; }
.search-row:last-child { margin-bottom: 0; }
input, select, textarea {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 11px 14px;
  color: var(--text);
  font-size: 14.5px;
  flex: 1;
  outline: none;
  font-family: inherit;
  transition: border-color 0.15s var(--ease), background 0.15s var(--ease);
  -webkit-appearance: none;
  width: 100%;
}
input::placeholder, textarea::placeholder { color: var(--text3); }
input:focus, select:focus, textarea:focus { border-color: var(--green-border); background: var(--bg-hover); }
select { cursor: pointer; }
.btn-fire {
  background: var(--green);
  color: #06251a;
  border: none;
  border-radius: var(--radius-sm);
  padding: 11px 20px;
  font-size: 14.5px;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
  transition: transform 0.12s var(--ease), opacity 0.15s var(--ease), filter 0.15s;
}
.btn-fire:hover { filter: brightness(1.08); }
.btn-fire:active { transform: scale(0.97); }
.btn-fire:disabled { opacity: 0.4; }

/* ── Data row (scraped record) ── */
.data-row { display:flex; gap:10px; background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:9px; box-shadow:var(--shadow-card); transition:border-color .2s var(--ease),transform .2s var(--ease); cursor:pointer; }
.row-index { align-self:start; min-width:30px; color:var(--text3); font:800 11px 'Plus Jakarta Sans',sans-serif; padding-top:3px; }
.data-row-main { min-width:0; flex:1; }
.source-link { color:var(--green); text-decoration:none; font-weight:700; }
.source-link:hover { text-decoration:underline; }
.pagination { display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:6px; padding:12px 0 2px; }
.page-btn { min-width:36px; height:36px; padding:0 10px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--bg-elevated); color:var(--text2); font:700 12px inherit; cursor:pointer; }
.page-btn.active { color:var(--green); border-color:var(--green-border); background:var(--green-soft); }
.page-btn:disabled { opacity:.35; cursor:default; }
.page-gap { color:var(--text3); padding:0 2px; }
.data-row:hover { border-color: var(--border-strong); }
.data-head { display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; margin-bottom:7px; gap:10px; }
.data-title { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15.5px; font-weight: 700; line-height: 1.3; flex: 1; letter-spacing: -0.01em; }
.data-title a { text-decoration: none; }
.data-title a:hover { text-decoration: underline; text-decoration-color: var(--green-border); }
.data-badge { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: var(--radius-pill); background: var(--bg3); color: var(--text2); white-space: nowrap; border: 1px solid var(--border); letter-spacing: 0.1px; }
.data-sub { font-size: 12.5px; color: var(--text2); margin-bottom: 8px; line-height: 1.55; }
.data-badges { display:flex; align-items:center; gap:6px; flex-shrink:0; }
.match-badge { font-family:'Plus Jakarta Sans',sans-serif; font-size:13px; font-weight:800; padding:5px 9px; }
.tags { display:flex; flex-wrap:nowrap; gap:6px; margin:0; overflow-x:auto; scrollbar-width:none; }
.tags::-webkit-scrollbar { display:none; }
.tag { font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: var(--radius-pill); background: var(--indigo-soft); color: var(--indigo); border: 1px solid var(--indigo-border); white-space: nowrap; }
.data-actions { display: flex; gap: 8px; justify-content: flex-end; align-items: center; margin-top: 10px; padding-top: 12px; border-top: 1px solid var(--border); }
.btn-toggle { padding: 6px 13px; border-radius: var(--radius-pill); font-size: 11.5px; font-weight: 600; cursor: pointer; background: var(--bg3); color: var(--text2); border: 1px solid var(--border); margin-right: auto; transition: all 0.15s var(--ease); }
.btn-toggle:hover { border-color: var(--border-strong); color: var(--text); }
.btn-toggle.active { background: var(--indigo-soft); color: var(--indigo); border-color: var(--indigo-border); }
.btn-sm { padding: 7px 15px; border-radius: var(--radius-sm); font-size: 12px; font-weight: 600; cursor: pointer; border: none; transition: filter 0.15s, transform 0.12s var(--ease); }
.btn-sm:active { transform: scale(0.96); }
.btn-ghost { background: var(--bg3); color: var(--text2); border: 1px solid var(--border); }
.btn-ghost:hover { color: var(--text); border-color: var(--border-strong); }
.btn-danger { background: var(--red-soft); color: var(--red); border: 1px solid var(--red-border); }
.btn-danger:hover { filter: brightness(1.15); }

/* ── Data dashboard ── */
.overview { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; margin-bottom:12px; max-height:1000px; overflow:hidden; transition:max-height .24s var(--ease),opacity .18s,margin .2s; }
.overview.collapsed { max-height:0; opacity:0; margin-bottom:0; pointer-events:none; }
.overview-toggle { width:100%; display:flex; justify-content:space-between; align-items:center; padding:10px 2px; margin-bottom:6px; border:0; background:none; color:var(--text2); font:700 12px inherit; cursor:pointer; }
.overview-toggle strong { color:var(--text); }
.metric { background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius); padding:14px; cursor:pointer; transition:transform .12s var(--ease),border-color .15s; }
.metric:active { transform:scale(.98); }
.metric.active { border-color:var(--green-border); background:var(--green-soft); }
.metric-name { color:var(--text2); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; }
.metric-count { font-family:'Plus Jakarta Sans',sans-serif; font-size:25px; font-weight:800; margin-top:4px; }
.metric-total { grid-column:1/-1; background:linear-gradient(135deg,var(--green-soft),var(--indigo-soft)); }
.quick-filters { display:flex; width:100%; max-width:100%; min-width:0; flex-wrap:nowrap; gap:7px; overflow-x:auto; overscroll-behavior-x:contain; touch-action:pan-x; -webkit-overflow-scrolling:touch; padding:2px 0 12px; scrollbar-width:none; }
.quick-filters::-webkit-scrollbar { display:none; }
.filter-chip { flex:0 0 auto; border:1px solid var(--border); background:var(--bg3); color:var(--text2); border-radius:var(--radius-pill); padding:7px 12px; font:600 11px inherit; white-space:nowrap; cursor:pointer; }
.filter-chip.active { color:var(--green); border-color:var(--green-border); background:var(--green-soft); }
.list-head { display:flex; justify-content:space-between; align-items:center; margin:4px 2px 10px; }
.sort-bar { display:flex; align-items:center; gap:5px; margin:0 0 8px; overflow-x:auto; scrollbar-width:none; }
.sort-bar::-webkit-scrollbar { display:none; }
.sort-label { color:var(--text3); font-size:11px; font-weight:700; flex:0 0 auto; }
.sort-bar .filter-chip { padding:5px 9px; font-size:10.5px; }
.list-title { font-size:13px; font-weight:700; }
.latency { font-size:10px; color:var(--text3); }
.job-meta { display:flex; gap:8px; flex-wrap:wrap; color:var(--text2); font-size:11.5px; margin-bottom:9px; }
.tag.remote { color:var(--green); background:var(--green-soft); border-color:var(--green-border); }
.tag.interest { color:var(--amber); background:var(--amber-soft); border-color:var(--amber-border); font-weight:800; }
.tag.location { color:var(--amber); background:var(--amber-soft); border-color:var(--amber-border); }
@media (min-width:700px) { .overview { grid-template-columns:repeat(4,minmax(0,1fr)); } .metric-total { grid-column:auto; } }

/* ── Empty / loading ── */

/* ── 职位卡操作条：收藏 / 归档 ── */
.row-actions { display:flex; gap:8px; margin-top:12px; padding-top:12px; border-top:1px solid var(--border); }
.act { flex:1; display:inline-flex; align-items:center; justify-content:center; gap:6px;
  padding:8px 10px; border-radius:var(--radius-sm); font:600 12px inherit; cursor:pointer;
  background:var(--bg3); color:var(--text2); border:1px solid var(--border);
  transition:background .15s, color .15s, border-color .15s, transform .1s var(--ease); }
.act:hover { border-color:var(--border-strong); color:var(--text); }
.act:active { transform:scale(.97); }
.act.on.save { background:var(--amber-soft); color:var(--amber); border-color:var(--amber-border); }
.act.on.arch { background:var(--bg-hover); color:var(--text); border-color:var(--border-strong); }
.act.apply { background:var(--green-soft); color:var(--green); border-color:var(--green-border); text-decoration:none; }
.data-row.leaving { opacity:0; transform:translateX(-14px); transition:opacity .22s var(--ease), transform .22s var(--ease); }

/* ── 我的：分段控件 ── */
.seg { display:flex; gap:6px; background:var(--bg2); border:1px solid var(--border);
  border-radius:var(--radius-pill); padding:4px; margin-bottom:16px; }
.seg button { flex:1; border:none; background:transparent; color:var(--text2);
  font:700 12.5px inherit; padding:8px 10px; border-radius:var(--radius-pill); cursor:pointer;
  transition:background .15s, color .15s; }
.seg button.active { background:var(--green-soft); color:var(--green); }
.seg .n { font-weight:800; opacity:.75; margin-left:4px; font-variant-numeric:tabular-nums; }

/* ── 首页 ── */
.home-hero { background:linear-gradient(135deg,var(--green-soft),var(--indigo-soft));
  border:1px solid var(--border); border-radius:var(--radius); padding:20px; margin-bottom:16px; }
.home-hero .n { font-family:'Plus Jakarta Sans',sans-serif; font-size:40px; font-weight:800; line-height:1.05; }
.home-hero .l { color:var(--text2); font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; }
.home-hero .d { color:var(--text2); font-size:12.5px; margin-top:8px; }
.home-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:20px; }
.home-card { background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius);
  padding:16px; color:var(--text); cursor:pointer; text-align:left; transition:border-color .15s, transform .12s var(--ease); }
.home-card:active { transform:scale(.98); }
.home-card:hover { border-color:var(--border-strong); }
.home-card .t { font-weight:700; font-size:14px; margin-bottom:3px; }
.home-card .s { color:var(--text3); font-size:11.5px; }
.section-label { font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.6px;
  color:var(--text3); margin:20px 0 10px; }
.snackbar { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(var(--nav-h) + 20px);
  background:var(--bg3); color:var(--text); border:1px solid var(--border-strong);
  padding:10px 18px; border-radius:var(--radius-pill); font:600 12.5px inherit; z-index:99;
  opacity:0; pointer-events:none; transition:opacity .2s, bottom .2s var(--ease); }
.snackbar.show { opacity:1; bottom:calc(var(--nav-h) + 32px); }

/* ── 职位详情（全屏覆盖层） ── */
.detail { position:fixed; inset:0; background:var(--bg); z-index:200; overflow:hidden; display:flex; flex-direction:column;
  transform:translateX(100%); transition:transform .26s var(--ease); }
.detail.open { transform:translateX(0); }
.detail-bar { position:sticky; top:0; z-index:2; background:var(--bg2); border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:12px; padding:14px 16px; }
.detail-bar .back { background:none; border:none; color:var(--text); font-size:22px; cursor:pointer; line-height:1; padding:0 4px; }
.detail-bar .h { font-weight:700; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.detail-body { flex:1; min-height:0; overflow-y:auto; padding:18px 16px 20px; }
.verdict { display:flex; align-items:center; gap:14px; padding:16px; border-radius:var(--radius);
  border:1px solid var(--border); background:var(--bg-elevated); margin-bottom:16px; }
.verdict .score { font-family:'Plus Jakarta Sans',sans-serif; font-size:34px; font-weight:800; line-height:1; }
.verdict .vl { font-size:15px; font-weight:800; }
.verdict .vs { color:var(--text2); font-size:12.5px; margin-top:4px; line-height:1.5; }
.v-strong { color:var(--green); } .v-ok { color:var(--indigo); }
.v-careful { color:var(--amber); } .v-no { color:var(--red); }
.pane { background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius);
  padding:16px; margin-bottom:12px; }
.pane h4 { margin:0 0 10px; font-size:11px; font-weight:800; text-transform:uppercase;
  letter-spacing:.6px; color:var(--text3); }
.kv { display:flex; gap:10px; padding:7px 0; border-bottom:1px solid var(--border); font-size:13px; }
.kv:last-child { border-bottom:none; }
.kv .k { color:var(--text3); min-width:76px; flex-shrink:0; }
.kv .v { color:var(--text); }
.bullet { font-size:13px; color:var(--text2); line-height:1.65; padding-left:16px; position:relative; margin-bottom:6px; }
.bullet::before { content:'·'; position:absolute; left:5px; color:var(--text3); font-weight:800; }
.bullet.risk::before { content:'!'; color:var(--amber); font-size:11px; top:1px; }
.detail-foot { position:relative; flex-shrink:0; z-index:3; display:flex; gap:10px;
  padding:12px 16px calc(12px + var(--safe-bottom)); background:var(--bg2); border-top:1px solid var(--border); }
.detail-foot .act { padding:12px; font-size:13px; }
.gen-hint { text-align:center; color:var(--text3); font-size:12.5px; padding:10px 12px 16px; line-height:1.7; }

/* ── 统计 ── */
.bars { display:flex; flex-direction:column; gap:8px; }
.bar-row { display:grid; grid-template-columns:64px 1fr 44px; gap:10px; align-items:center; font-size:12px; }
.bar-row .lbl { color:var(--text2); font-weight:600; }
.bar-track { height:8px; background:var(--bg3); border-radius:4px; overflow:hidden; }
.bar-fill { height:100%; background:linear-gradient(90deg,var(--green),var(--indigo)); border-radius:4px; }
.bar-row .num { text-align:right; color:var(--text3); font-variant-numeric:tabular-nums; }
.stat-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:14px; }
.stat-box { background:var(--bg3); border-radius:var(--radius-sm); padding:12px; text-align:center; }
.stat-box .v { font-family:'Plus Jakarta Sans',sans-serif; font-size:19px; font-weight:800; }
.stat-box .k { color:var(--text3); font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; margin-top:3px; }
.read-dot { display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--green); margin-left:6px; vertical-align:middle; }
.empty { text-align: center; color: var(--text3); padding: 60px 20px; font-size: 13.5px; font-weight: 500; }
.spin { display: inline-block; width: 22px; height: 22px; border: 2.5px solid var(--border); border-top-color: var(--green); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 40px auto; }
@keyframes spin { to { transform: rotate(360deg); } }
.center-spin { display: flex; justify-content: center; padding: 40px 0; }

/* ── Title effect ── */
.title-fx { background: linear-gradient(135deg, var(--green), #67e8f9); -webkit-background-clip: text; background-clip: text; color: transparent; }

/* ── Channel picker (二级手风琴：一级类目=板块，点击展开二级渠道列表) ── */
.board-section { margin-bottom: 8px; }
.board-section:last-child { margin-bottom: 0; }
.board-title { font-size: 13px; font-weight: 700; color: var(--text); letter-spacing: 0.2px; padding: 13px 4px; display: flex; align-items: baseline; gap: 8px; cursor: pointer; user-select: none; border-bottom: 1px solid var(--border); transition: opacity 0.15s; }
.board-title:hover { opacity: 0.8; }
.board-arrow { color: var(--green); font-size: 10px; width: 10px; display: inline-block; transition: transform 0.2s var(--ease); }
.board-desc { font-size: 11px; font-weight: 500; color: var(--text3); }
.board-count { margin-left: auto; font-size: 10.5px; font-weight: 700; color: var(--text2); background: var(--bg3); padding: 2px 9px; border-radius: var(--radius-pill); border: 1px solid var(--border); }
.board-body { padding-top: 10px; }
.ch-pick { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: all 0.15s var(--ease); box-shadow: var(--shadow-card); }
.ch-pick:hover { border-color: var(--border-strong); background: var(--bg-hover); }
.ch-pick:active { transform: scale(0.99); }
.ch-pick-info { flex: 1; }
.ch-pick-name { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15.5px; font-weight: 700; margin-bottom: 3px; letter-spacing: -0.01em; }
.ch-pick-desc { font-size: 12px; color: var(--text3); line-height: 1.4; }
.ch-pick-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.badge { font-size: 10.5px; padding: 4px 10px; border-radius: var(--radius-pill); font-weight: 700; border: 1px solid transparent; }
.badge.active { background: var(--green-soft); color: var(--green); border-color: var(--green-border); }
.badge.missing { background: var(--amber-soft); color: var(--amber); border-color: var(--amber-border); }
.badge.off { background: var(--bg3); color: var(--text3); border-color: var(--border); }
.ch-arrow { color: var(--text3); font-size: 17px; }

/* ── Channel detail ── */
.detail-header { display: flex; align-items: center; gap: 6px; margin-bottom: 18px; }
.btn-back { background: var(--bg-elevated); border: 1px solid var(--border); color: var(--text2); font-size: 19px; cursor: pointer; padding: 6px 12px; border-radius: var(--radius-pill); line-height: 1; transition: all 0.15s; }
.btn-back:hover { color: var(--text); border-color: var(--border-strong); }
.detail-title { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
.field-group { margin-bottom: 16px; }
.field-label { font-size: 12px; font-weight: 600; color: var(--text2); margin-bottom: 7px; display: flex; align-items: center; gap: 4px; text-transform: uppercase; letter-spacing: 0.4px; }
.field-label .req { color: var(--red); }
.field-help { font-size: 11.5px; color: var(--text3); margin-top: 5px; line-height: 1.5; }
.ch-footer-bar { display: flex; justify-content: space-between; align-items: center; padding-top: 18px; margin-top: 18px; border-top: 1px solid var(--border); }
.toggle { display: flex; align-items: center; gap: 9px; cursor: pointer; }
.toggle input { display: none; }
.toggle-track { width: 42px; height: 25px; background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius-pill); position: relative; transition: background 0.2s var(--ease); }
.toggle-track::after { content: ''; position: absolute; width: 19px; height: 19px; background: var(--text3); border-radius: 50%; top: 2px; left: 2px; transition: all 0.2s var(--ease); }
.toggle input:checked + .toggle-track { background: var(--green); border-color: var(--green); }
.toggle input:checked + .toggle-track::after { left: 20px; background: #06251a; }
.toggle-label { font-size: 13.5px; font-weight: 600; color: var(--text2); }
.btn-save { background: var(--green); color: #06251a; border: none; border-radius: var(--radius-sm); padding: 10px 22px; font-size: 13.5px; font-weight: 700; cursor: pointer; transition: filter 0.15s, transform 0.12s var(--ease); }
.btn-save:hover { filter: brightness(1.08); }
.btn-save:active { transform: scale(0.97); }
.toast { font-size: 12px; font-weight: 600; }
.toast.ok { color: var(--green); }
.toast.err { color: var(--red); }
.pipeline-card { background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:16px; }
.pipeline-title { color:var(--text3); font-size:10.5px; font-weight:800; letter-spacing:.5px; text-transform:uppercase; margin-bottom:11px; }
.pipeline-flow { display:flex; align-items:center; gap:6px; overflow-x:auto; padding-bottom:4px; }
.pipeline-step { flex:0 0 auto; padding:7px 10px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--bg3); color:var(--text2); font-size:11px; font-weight:650; }
.pipeline-arrow { color:var(--green); font-size:12px; flex:0 0 auto; }
.pipeline-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-top:12px; }
.pipeline-stat { padding:8px; border-radius:var(--radius-sm); background:var(--bg3); text-align:center; }
.pipeline-stat b { display:block; color:var(--text); font-size:15px; }
.pipeline-stat span { color:var(--text3); font-size:9.5px; }
.pipeline-fresh { color:var(--text3); font-size:10.5px; line-height:1.5; margin-top:9px; }

/* ── Telegram accounts ── */
.tg-section { background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-top: 18px; }
.tg-section-title { font-size: 13px; font-weight: 700; color: var(--text2); margin-bottom: 14px; }
.acct-row { display: flex; justify-content: space-between; align-items: center; padding: 11px 12px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-sm); margin-bottom: 8px; }
.acct-info { display: flex; align-items: center; gap: 9px; font-size: 13px; }
.acct-name { font-weight: 700; }
.acct-phone { color: var(--text3); font-size: 12px; }
.acct-btns { display: flex; gap: 6px; }
.btn-login { background: var(--blue-soft); color: var(--blue); border: 1px solid rgba(56,189,248,0.3); border-radius: var(--radius-sm); padding: 6px 12px; font-size: 12px; font-weight: 700; cursor: pointer; }
.btn-del { background: var(--red-soft); color: var(--red); border: 1px solid var(--red-border); border-radius: var(--radius-sm); padding: 6px 11px; font-size: 12px; font-weight: 600; cursor: pointer; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 0 3px transparent; }
.dot.g { background: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }
.dot.r { background: var(--red); box-shadow: 0 0 0 3px var(--red-soft); }
.add-acct-form { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }
.add-acct-form input { font-size: 13px; padding: 9px 12px; }
.add-acct-form .btn-full { grid-column: 1/-1; }
.btn-full { width: 100%; background: var(--blue); color: #05202e; border: none; border-radius: var(--radius-sm); padding: 10px; font-size: 13.5px; font-weight: 700; cursor: pointer; transition: filter 0.15s; }
.btn-full:hover { filter: brightness(1.08); }
.login-box { margin-top: 8px; margin-bottom: 8px; padding: 11px; background: var(--bg-elevated); border-radius: var(--radius-sm); border: 1px solid var(--border); }
.login-row { display: flex; gap: 8px; margin-bottom: 8px; }
.login-row:last-child { margin-bottom: 0; }
.login-row input { font-size: 13px; padding: 9px 12px; }
.btn-code { background: var(--blue-soft); color: var(--blue); border: 1px solid rgba(56,189,248,0.3); border-radius: var(--radius-sm); padding: 9px 14px; font-size: 12.5px; font-weight: 700; cursor: pointer; white-space: nowrap; }
</style>
</head>

<script>
// ══ Global data domain ══
const DOMAIN_SWITCHER = `
  <div class="domain-switch">
    <button class="domain-trigger" type="button" aria-haspopup="true" aria-expanded="false" onclick="toggleDomainMenu(this)">
      <span class="domain-icon">◎</span><span>海外职位</span><span class="domain-caret">⌄</span>
    </button>
    <div class="domain-menu" role="menu">
      <button class="domain-option active" type="button"><span>◎</span><span>海外职位挖掘</span><span class="soon">当前</span></button>
      <button class="domain-option" type="button" disabled><span>◇</span><span>商品数据挖掘</span><span class="soon">待接入</span></button>
      <button class="domain-option" type="button" disabled><span>▣</span><span>企业信息挖掘</span><span class="soon">待接入</span></button>
      <button class="domain-option" type="button" disabled><span>◉</span><span>舆情资讯挖掘</span><span class="soon">待接入</span></button>
    </div>
  </div>`;
document.querySelectorAll('.topbar').forEach(bar => bar.insertAdjacentHTML('beforeend', DOMAIN_SWITCHER));
function toggleDomainMenu(trigger) {
  const root = trigger.closest('.domain-switch');
  const open = !root.classList.contains('open');
  document.querySelectorAll('.domain-switch.open').forEach(el => {
    el.classList.remove('open');
    el.querySelector('.domain-trigger').setAttribute('aria-expanded', 'false');
  });
  root.classList.toggle('open', open);
  trigger.setAttribute('aria-expanded', String(open));
}
document.addEventListener('click', event => {
  if (event.target.closest('.domain-switch')) return;
  document.querySelectorAll('.domain-switch.open').forEach(el => {
    el.classList.remove('open');
    el.querySelector('.domain-trigger').setAttribute('aria-expanded', 'false');
  });
});

// ══ PWA ══
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');

// ══ Tab switching ══
const TABS = ['home', 'data', 'fav', 'mine', 'drill'];
function switchTab(tab) {
  const started = performance.now();
  TABS.forEach(t => {
    document.getElementById(`screen-${t}`).classList.toggle('active', t === tab);
    document.getElementById(`nav-${t}`).classList.toggle('active', t === tab);
  });
  if (tab === 'home') renderHome();
  if (tab === 'data') renderDataDashboard(started);
  if (tab === 'fav' || tab === 'mine') loadMine();
  if (tab === 'drill') renderDrill();
}

// ══ Channel select init ══
let _schema = null, _cfgs = null;

async function loadChannels() {
  try {
    const res = await fetch('/api/channels');
    const data = await res.json();
    const filterSel = document.getElementById('data-filter');
    filterSel.innerHTML = '<option value="">全部渠道</option>' +
      data.channels.map(ch => `<option value="${esc(ch.id)}">${esc(ch.name)}</option>`).join('');
  } catch {}
}
loadChannels();
showChannelPicker();
loadMarkIndex();

// ══ 职位数据看板：页面启动即预取，Tab 点击只做内存渲染 ══
const dataState = { summary:null, jobs:[], byChannel:{}, totals:{}, channel:'', tag:'', preference:'', sort:'match', order:'desc', minScore:0, withinDays:90, page:1, pageSize:20, ready:false };
let dataPromise = null;
const DATA_CACHE_KEY = 'scraper:data:first-page:v4';

try {
  const cached = JSON.parse(localStorage.getItem(DATA_CACHE_KEY) || 'null');
  if (cached && Date.now() - cached.savedAt < 10 * 60 * 1000) {
    dataState.summary = cached.summary || null;
    dataState.jobs = cached.jobs || [];
    dataState.totals.all = cached.total || dataState.jobs.length;
    dataState.ready = dataState.jobs.length > 0;
  }
} catch {}

function saveFirstPageCache() {
  if (dataState.channel || dataState.tag || dataState.preference || dataState.minScore || dataState.page !== 1 || dataState.sort !== 'match' || dataState.order !== 'desc') return;
  if (!dataState.summary) return;
  try { localStorage.setItem(DATA_CACHE_KEY, JSON.stringify({savedAt:Date.now(),summary:dataState.summary,jobs:dataState.jobs,total:dataState.totals.all||dataState.jobs.length})); } catch {}
}

function prefetchData(force=false) {
  if (dataPromise && !force) return dataPromise;
  const started = performance.now();
  dataState.page = 1;
  dataPromise = fetch(`/api/scraped?${jobQuery(dataState.channel)}`).then(r=>r.json()).then(jobs => {
    const key = dataState.channel || 'all';
    if (dataState.channel) dataState.byChannel[dataState.channel] = jobs.jobs || [];
    else dataState.jobs = jobs.jobs || [];
    dataState.totals[key] = jobs.total ?? (jobs.jobs||[]).length;
    dataState.ready = true;
    saveFirstPageCache();
    if (document.getElementById('screen-data').classList.contains('active')) renderDataDashboard(started);
    fetch('/api/scraped/summary').then(r=>r.json()).then(summary => {
      dataState.summary = summary;
      saveFirstPageCache();
      renderHome();
      if (document.getElementById('screen-data').classList.contains('active')) renderDataDashboard(started);
    }).catch(()=>{});
  }).catch((error) => {
    dataPromise = null;
    document.getElementById('data-latency').textContent='加载失败 · 点此重试';
    document.getElementById('data-latency').onclick=()=>prefetchData(true);
    document.getElementById('channel-overview').innerHTML='<div class="metric metric-total"><div class="metric-name">加载失败</div><div class="metric-count">!</div></div>';
    document.getElementById('job-list').innerHTML=`<div class="empty">${esc(error.message||'数据加载失败')}<br><button class="btn-sm btn-ghost" style="margin-top:12px" onclick="prefetchData(true)">重新加载</button></div>`;
  });
  return dataPromise;
}
prefetchData();

function renderDataDashboard(started) {
  const latency = document.getElementById('data-latency');
  if (started) latency.textContent = `${Math.round(performance.now()-started)}ms 响应`;
  if (!dataState.ready) {
    document.getElementById('job-list').innerHTML='<div class="center-spin"><div class="spin"></div></div>';
    return;
  }
  const summary = dataState.summary;
  if (summary) {
    const cards = [{channel:'',count:summary.total},...(summary.channels||[])].filter((item,i)=>i===0||item.count>0);
    document.getElementById('overview-total').textContent = `${summary.total || 0} 条 · ${(summary.channels||[]).filter(x=>x.count).length} 渠道`;
    document.getElementById('channel-overview').innerHTML = cards.map((item,i) => `
      <div class="metric ${i===0?'metric-total':''} ${dataState.channel===item.channel?'active':''}" onclick="setChannelFilter('${esc(item.channel)}')">
        <div class="metric-name">${i===0?'全部职位':esc(channelName(item.channel))}</div>
        <div class="metric-count">${item.count}</div>
      </div>`).join('');
    const pref = [{key:'',label:'全部偏好',count:summary.total},...(summary.preference_counts||[])];
    document.getElementById('preference-filters').innerHTML = pref.map(item => `
      <button class="filter-chip ${dataState.preference===item.key?'active':''}" onclick="setPreferenceFilter('${esc(item.key)}')">
        ${esc(item.label)} <strong>${item.count}</strong>
      </button>`).join('');
  }
  const jobs = dataState.channel ? (dataState.byChannel[dataState.channel]||[]) : dataState.jobs;
  const sortName = {match:'匹配度',posted:'发布时间',salary:'薪资'}[dataState.sort];
  const key = dataState.channel || 'all';
  const total = dataState.totals[key] ?? jobs.length;
  const arrow = dataState.order === 'desc' ? '↓' : '↑';
  const pages = Math.max(1, Math.ceil(total / dataState.pageSize));
  document.getElementById('job-list-title').textContent = `按${sortName}${arrow} · 第 ${dataState.page}/${pages} 页 · 共 ${total} 条`;
  document.getElementById('job-list').innerHTML = jobs.length
    ? jobs.map((job,index)=>jobRow(job,(dataState.page-1)*dataState.pageSize+index+1)).join('') + pagination(pages)
    : '<div class="empty">当前筛选暂无职位</div>';
}

function pagination(totalPages) {
  if (totalPages <= 1) return '';
  const current = dataState.page;
  const pages = [...new Set([1,current-1,current,current+1,totalPages])].filter(p=>p>=1&&p<=totalPages).sort((a,b)=>a-b);
  let last = 0;
  const numbered = pages.map(p => {
    const gap = last && p-last>1 ? '<span class="page-gap">…</span>' : '';
    last = p;
    return `${gap}<button class="page-btn ${p===current?'active':''}" onclick="loadDataPage(${p})">${p}</button>`;
  }).join('');
  return `<nav class="pagination" aria-label="职位分页"><button class="page-btn" onclick="loadDataPage(${current-1})" ${current===1?'disabled':''}>上一页</button>${numbered}<button class="page-btn" onclick="loadDataPage(${current+1})" ${current===totalPages?'disabled':''}>下一页</button></nav>`;
}

async function loadDataPage(page=1) {
  const started = performance.now();
  dataState.page = Math.max(1, page);
  document.getElementById('job-list').innerHTML = '<div class="center-spin"><div class="spin"></div></div>';
  const q = jobQuery(dataState.channel);
  q.set('offset', String((dataState.page-1)*dataState.pageSize));
  try {
    const r = await fetch(`/api/scraped?${q}`).then(res=>res.json());
    const key = dataState.channel || 'all';
    if (dataState.channel) dataState.byChannel[dataState.channel] = r.jobs || [];
    else dataState.jobs = r.jobs || [];
    dataState.totals[key] = r.total ?? 0;
    renderDataDashboard(started);
    document.querySelector('#screen-data .screen-body').scrollTo({top:0,behavior:'smooth'});
  } catch (error) {
    document.getElementById('job-list').innerHTML = `<div class="empty">加载失败：${esc(error.message||'')}</div>`;
  }
}

function channelName(id) {

function jobQuery(channel='') {
  const q = new URLSearchParams({limit:String(dataState.pageSize)});
  if (channel) q.set('channel', channel);
  if (dataState.tag === 'remote') q.set('remote', 'true');
  else if (dataState.tag) q.set('tag', dataState.tag);
  if (dataState.minScore) q.set('min_score', dataState.minScore);
  if (dataState.withinDays) q.set('within_days', dataState.withinDays);
  if (dataState.preference) q.set('preference', dataState.preference);
  q.set('sort', dataState.sort);
  q.set('order', dataState.order);
  return q;
}

async function toggleQualityFilter(key, value, button) {

function relativeTime(value) {
  if (!value) return '';
  const ms = Date.now() - new Date(value).getTime();
  if (!Number.isFinite(ms)) return '';
  const days = Math.max(0, Math.floor(ms / 86400000));
  if (days === 0) return '今天';
  if (days < 30) return `${days} 天前`;
  if (days < 365) return `${Math.floor(days / 30)} 个月前`;
  return `${Math.floor(days / 365)} 年前`;
}

function scoreBadge(score) {
  if (score == null || score < 0) return '<span class="data-badge">待评分</span>';
  const color = score >= 80 ? 'var(--green)' : score >= 60 ? 'var(--indigo)' : score < 40 ? 'var(--text3)' : 'var(--amber)';
  return `<span class="data-badge match-badge" style="color:${color};border-color:${color}">${score}% 匹配</span>`;
}

function jobRow(j, index) {

    <div class="tags">${interestTags}${regions}${!regions&&j.city?`<span class="tag location">📍 ${esc(j.city)}</span>`:''}${tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>

// ══ 收藏 / 归档 ══
const marks = { saved:new Set(), archived:new Set(), read:new Set(), rows:{saved:[],archived:[]}, tab:'saved' };
const markKey = j => `${j.channel}:${j.external_id}`;

async function loadMarkIndex() {
  try {
    const res = await fetch('/api/marks/index');
    const data = await res.json();
    marks.saved = new Set(data.saved || []);
    marks.archived = new Set(data.archived || []);
    marks.read = new Set(data.read || []);
  } catch {}
  updateMarkCounts();
}

function updateMarkCounts() {
  const s = marks.saved.size, a = marks.archived.size;
  const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
  set('cnt-saved', s); set('cnt-archived', a);
  const badge = document.getElementById('nav-fav');
  if (badge) badge.classList.toggle('has-items', s > 0);
  const hm = document.getElementById('home-marks');
  if (hm) hm.textContent = `收藏 ${s} · 归档 ${a}`;
}

function snack(msg) {
  let el = document.querySelector('.snackbar');
  if (!el) { el = document.createElement('div'); el.className = 'snackbar'; document.body.appendChild(el); }
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 1800);
}

async function mark(jobId, channel, externalId, state, btn) {
  const key = `${channel}:${externalId}`;
  try {
    const res = await fetch('/api/marks', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ job_id: jobId || null, channel, external_id: externalId, state })
    });
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    marks.saved.delete(key); marks.archived.delete(key);
    if (data.state) marks[data.state].add(key);
    updateMarkCounts();

    if (state === 'archived' && data.state === 'archived') {
      // 归档后立刻从列表里移走，不用等下次刷新
      const card = btn && btn.closest('.data-row');
      if (card) { card.classList.add('leaving'); setTimeout(() => card.remove(), 220); }
      dataState.jobs = dataState.jobs.filter(j => markKey(j) !== key);
      Object.keys(dataState.byChannel).forEach(c => {
        dataState.byChannel[c] = (dataState.byChannel[c] || []).filter(j => markKey(j) !== key);
      });
      snack('已归档，列表不再展示');
      return;
    }
    if (btn) {
      const on = !!data.state;
      btn.classList.toggle('on', on);
      if (state === 'saved') btn.innerHTML = on ? '★ 已收藏' : '☆ 收藏';
      else btn.innerHTML = on ? '已归档' : '归档';
    }
    snack(data.state === 'saved' ? '已收藏' : data.state === 'archived' ? '已归档' : '已取消');
  } catch (e) {
    snack('操作失败：' + (e.message || '未知错误'));
  }
}

async function loadMine() {
  const spin = '<div class="center-spin"><div class="spin"></div></div>';
  ['fav-list', 'arch-list'].forEach(id => {
    const el = document.getElementById(id);
    if (el && !el.dataset.loaded) el.innerHTML = spin;
  });
  try {
    // 一次拿全部标记，Turso 是单连接串行的，能合并的请求就别拆
    const all = (await fetch('/api/marks').then(r => r.json())).marks || [];
    const key = m => `${m.channel}:${m.external_id}`;
    marks.rows.saved = all.filter(m => m.state === 'saved');
    marks.rows.archived = all.filter(m => m.state === 'archived');
    marks.saved = new Set(marks.rows.saved.map(key));
    marks.archived = new Set(marks.rows.archived.map(key));
    marks.read = new Set(all.filter(m => m.read_at).map(key));
    updateMarkCounts();
    renderMine();
    ['fav-list', 'arch-list'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.dataset.loaded = '1';
    });
    renderMineStats();
  } catch (e) {
    ['fav-list', 'arch-list'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.innerHTML = `<div class="empty">加载失败：${esc(e.message || '')}</div>`;
    });
  }
}

function markCard(m, kind) {
  const skills = (m.skills || []).slice(0, 6).map(t => `<span class="tag">${esc(t)}</span>`).join('');
  const undo = kind === 'saved' ? '取消收藏' : '取消归档';

    <div class="data-head">
      <div class="data-title" ${jid?`style="cursor:pointer" onclick="openDetail(${jid})"`:''}>${esc(m.title || '未命名职位')}${m.read_at?'<span class="read-dot"></span>':''}</div>
      <span class="data-badge">${esc(channelName(m.channel))}</span>
    </div>
    <div class="job-meta"><strong>${esc(m.company || '未知公司')}</strong>${m.salary ? `<span>${esc(m.salary)}</span>` : ''}</div>
    <div class="tags">${m.city ? `<span class="tag location">📍 ${esc(m.city)}</span>` : ''}${skills}</div>
    ${m.description ? `<div class="data-sub">${esc(m.description.slice(0, 220))}</div>` : ''}

function renderMine() {
  const fav = document.getElementById('fav-list');
  if (fav) {
    const rows = marks.rows.saved || [];
    fav.innerHTML = rows.length
      ? rows.map(m => markCard(m, 'saved')).join('')
      : '<div class="empty">还没有收藏。<br>在「数据」里点 ☆ 收藏，想投的职位就会攒到这儿。</div>';
  }
  const arch = document.getElementById('arch-list');
  if (arch) {
    const rows = marks.rows.archived || [];
    arch.innerHTML = rows.length
      ? rows.map(m => markCard(m, 'archived')).join('')
      : '<div class="empty">还没有归档。<br>归档过的职位会从列表消失，但能在这里翻回来。</div>';
  }
}

async function undoMark(id, channel, externalId) {
  try {
    await fetch(`/api/marks/${id}`, { method:'DELETE' });
    const key = `${channel}:${externalId}`;
    marks.saved.delete(key); marks.archived.delete(key);
    marks.rows.saved = marks.rows.saved.filter(m => m.id !== id);
    marks.rows.archived = marks.rows.archived.filter(m => m.id !== id);
    updateMarkCounts(); renderMine();
    snack('已取消');
    prefetchData(true);
  } catch { snack('操作失败'); }
}

const detail = { job:null, generating:false };
const VERDICT_CLASS = {'强烈推荐':'v-strong','值得一投':'v-ok','谨慎':'v-careful','不建议':'v-no'};

}

function _intentPane(p) {
  const hi = p.hiring_intent;
  let type = '', reason = '';
  if (hi && typeof hi === 'object') { type = hi.type || ''; reason = hi.reason || ''; }
  else if (typeof hi === 'string') { reason = hi; }
  if (!type && !reason) {
    return `<div class="pane"><h4>招聘意图</h4><div class="bullet">旧画像没有这一项，点下面重新生成</div></div>`;
  }
  return `<div class="pane"><h4>招聘意图</h4>
    <div class="kv"><span class="k">类型</span><span class="v">${esc(type||'看不出')}</span></div>
    <div class="kv"><span class="k">依据</span><span class="v">${esc(reason||'—')}</span></div>
  </div>`;
}

function money(n) { return n ? '$' + Math.round(n/1000) + 'K' : '—'; }
const USD_CNY = 7.14; // 粗折算，够用来给量级心里有数，不追求汇率精确
function moneyCny(n) { return n ? '¥' + Math.round(n * USD_CNY / 10000) + 'w' : '—'; }

function renderDetail() {
  const j = detail.job;
  document.getElementById('detail-title').textContent = j.title || '职位详情';
  const p = j.profile;
  const skills = (j.skills||[]).map(t => `<span class="tag">${esc(t)}</span>`).join('');

  let html = `<div class="pane">
    <h4>职位</h4>
    <div style="font-size:17px;font-weight:700;line-height:1.4;margin-bottom:10px">${esc(j.title||'')}</div>
    <div class="kv"><span class="k">公司</span><span class="v">${esc(j.company||'未知')}</span></div>
    <div class="kv"><span class="k">薪资</span><span class="v">${esc(j.salary||'未披露')}${j.salary_max?` <span style="color:var(--text3)">≈ ${money(j.salary_min)}–${money(j.salary_max)}/年 (${moneyCny(j.salary_min)}–${moneyCny(j.salary_max)})</span>`:''}</span></div>

    ${skills?`<div class="tags" style="margin-top:10px">${skills}</div>`:''}
  </div>`;

  if (p) {
    const vc = VERDICT_CLASS[p.verdict] || 'v-ok';
    html += `<div class="verdict">
      <div class="score ${vc}">${p.fit_score ?? '—'}</div>
      <div><div class="vl ${vc}">${esc(p.verdict||'')}</div><div class="vs">${esc(p.one_liner||'')}</div></div>
    </div>`;
    html += `<div class="pane"><h4>能不能投</h4>
      <div class="kv"><span class="k">中国大陆</span><span class="v">${esc(p.china_applicable||'未知')}</span></div>
      <div class="kv"><span class="k">原因</span><span class="v">${esc(p.china_reason||'—')}</span></div>
      <div class="kv"><span class="k">资历要求</span><span class="v">${esc(p.seniority||'—')}</span></div>
      <div class="kv"><span class="k">薪资判断</span><span class="v">${esc(p.salary_note||'—')}</span></div>
    </div>`;
    const list = (arr, cls='') => (arr||[]).map(x => `<div class="bullet ${cls}">${esc(x)}</div>`).join('') || '<div class="bullet">—</div>';
    html += `<div class="pane"><h4>技能匹配</h4>
      <div class="kv"><span class="k">对得上</span><span class="v">${(p.stack_match||[]).join('、')||'—'}</span></div>
      <div class="kv"><span class="k">缺什么</span><span class="v">${(p.stack_gap||[]).join('、')||'—'}</span></div>
    </div>`;
    html += _intentPane(p);
    const src = (p.comment_sources||[]).join(' · ') || '未拉到外部评论';
    html += `<div class="pane"><h4>职位画像</h4>
      <div class="kv"><span class="k">评论来源</span><span class="v">${esc(src)}</span></div>
      <div class="bullet">${esc(p.job_portrait||'旧画像没有这一项，点下面重新生成')}</div>

async function genProfile(jobId, refresh) {
  if (detail.generating) return;
  detail.generating = true;
  const btn = document.getElementById('btn-gen');
  if (btn) { btn.textContent = '生成中…'; btn.disabled = true; }
  snack('本机 Claude 正在评估，约 30–60 秒');
  try {
    const has = !!(detail.job && detail.job.profile);
    const res = await fetch(`/api/jobs/${jobId}/profile${has?'?refresh=true':''}`, { method:'POST' });
    if (!res.ok) throw new Error((await res.json()).detail || '生成失败');
    const data = await res.json();
    detail.job.profile = data.profile;
    renderDetail();
    snack(data.cached ? '读取已有画像' : '画像已生成');
  } catch (e) {
    snack(e.message || '生成失败');
    if (btn) { btn.textContent = '生成画像'; btn.disabled = false; }
  } finally {
    detail.generating = false;
  }

// ══ mined_accounts 查/删（渠道下 AI 挖到的账号 + 标签 + 置信度） ══
async function onChannelFilterChange() {
  await loadTopics();
  loadAccounts();
}

async function loadTopics() {
  const channel = document.getElementById('data-filter').value;
  const topicSel = document.getElementById('topic-filter');
  try {
    const qs = channel ? `?channel=${encodeURIComponent(channel)}` : '';
    const res = await fetch(`/api/accounts/topics${qs}`);
    const data = await res.json();
    topicSel.innerHTML = '<option value="">全部主题</option>' +
      data.topics.map(t => `<option value="${esc(t.topic)}">${esc(t.topic)}</option>`).join('');
  } catch {}
}

async function loadAccounts() {
  const el = document.getElementById('account-list');
  el.innerHTML = '<div class="center-spin"><div class="spin"></div></div>';
  const channel = document.getElementById('data-filter').value;
  const topic = document.getElementById('topic-filter').value;
  try {
    const params = new URLSearchParams({ limit: '200' });
    if (channel) params.set('channel', channel);
    if (topic) params.set('topic', topic);
    const res = await fetch(`/api/accounts?${params}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || `HTTP ${res.status}`);
    el.innerHTML = data.accounts.length
      ? data.accounts.map(accountRow).join('')
      : '<div class="empty">mined_accounts 表暂无数据</div>';
  } catch (e) { el.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

function accountRow(a) {
  const confColor = a.confidence >= 70 ? 'var(--green)' : 'var(--text3)';
  const valScore = a.value_score ?? 0;
  const valColor = valScore >= 70 ? 'var(--green)' : 'var(--text3)';
  const tags = (a.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join('');
  const bioText = a.bio ? esc(a.bio).replace(/\n/g, '<br>') : '<span style="color:var(--text3)">该账号暂无抓取到的简介</span>';
  const summaryText = a.rationale ? esc(a.rationale) : '<span style="color:var(--text3)">暂无 AI 摘要</span>';
  return `<div class="data-row">
    <div class="data-head">
      <div class="data-title">${a.profile_url ? `<a href="${esc(a.profile_url)}" target="_blank" style="color:inherit">@${esc(a.handle)}</a>` : '@' + esc(a.handle)}</div>
      <div class="data-badges">
        <span class="data-badge" style="color:${confColor};border-color:${confColor}" title="置信度：是否符合主题">置信 ${a.confidence}%</span>
        <span class="data-badge" style="color:${valColor};border-color:${valColor}" title="价值分：内容对我有多大用">价值 ${valScore}%</span>
      </div>
    </div>
    <div class="data-sub">${esc(a.topic)}</div>
    ${tags ? `<div class="tags">${tags}</div>` : ''}
    <div class="data-sub" data-bio="${encodeURIComponent(bioText)}" data-summary="${encodeURIComponent(summaryText)}" data-mode="bio" style="margin-top:6px">${bioText}</div>
    <div class="data-actions">
      <button class="btn-toggle" onclick="toggleAccountView(this)">看 AI 摘要（基于历史发帖）</button>
      <button class="btn-sm btn-danger" onclick="deleteAccount(${a.id}, this)">删除</button>
    </div>
  </div>`;
}

function toggleAccountView(btn) {
  const row = btn.closest('.data-row');
  const content = row.querySelector('[data-bio]');
  const showingBio = content.dataset.mode === 'bio';
  content.innerHTML = decodeURIComponent(showingBio ? content.dataset.summary : content.dataset.bio);
  content.dataset.mode = showingBio ? 'summary' : 'bio';
  btn.textContent = showingBio ? '看账号简介' : '看 AI 摘要（基于历史发帖）';
  btn.classList.toggle('active', showingBio);
}

async function deleteAccount(id, el) {
  if (!confirm('确定删除这个账号？')) return;
  try {
    const res = await fetch(`/api/accounts/${id}`, { method: 'DELETE' });
    if (res.ok) el.closest('.data-row').remove();
  } catch {}
}

// ══ Channel config — Step 1: picker（按板块分组，一个板块对应一个下游 app） ══
let _boards = null;
let _channelStatus = {};

async function showChannelPicker() {
  const body = document.getElementById('config-body');
  body.innerHTML = '<div class="center-spin"><div class="spin"></div></div>';
  try {
    const [sr, cr, st] = await Promise.all([
      fetch('/api/channels/schema').then(r=>r.json()),
      fetch('/api/channels/config').then(r=>r.json()),
      fetch('/api/channels/status').then(r=>r.json()),
    ]);
    _schema = sr.schema; _cfgs = cr.channels; _boards = sr.boards || {};
    _channelStatus = st.channels || {};

    const byBoard = {};
    Object.entries(_schema).forEach(([id, s]) => {
      const b = s.board || '_';
      (byBoard[b] = byBoard[b] || []).push([id, s]);
    });

    body.innerHTML = Object.entries(_boards).map(([boardId, board]) => {
      const items = byBoard[boardId] || [];
      const list = items.length
        ? items.map(([id, s]) => channelPickRow(id, s)).join('')
        : '<div class="empty" style="padding:20px">暂无渠道</div>';
      return `<div class="board-section">
        <div class="board-title" onclick="toggleBoard('${boardId}')">
          <span class="board-arrow" id="ba-${boardId}">▸</span>
          ${esc(board.name)}<span class="board-desc">${esc(board.desc||'')}</span>
          <span class="board-count">${items.length}</span>
        </div>
        <div class="board-body" id="bb-${boardId}" style="display:none">${list}</div>
      </div>`;
    }).join('');
  } catch (e) { body.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

function toggleBoard(boardId) {
  const bodyEl = document.getElementById(`bb-${boardId}`);
  const arrow = document.getElementById(`ba-${boardId}`);
  const open = bodyEl.style.display !== 'none';
  bodyEl.style.display = open ? 'none' : 'block';
  arrow.textContent = open ? '▸' : '▾';
}

function channelPickRow(id, s) {
  const cfg = _cfgs[id] || {};
  const en = cfg.enabled ?? false;
  const filled = s.fields.filter(f=>f.required).every(f=>!!cfg[f.key]);
  const status = en && filled ? 'active' : en ? 'missing' : 'off';
  const badge = en && filled ? '已就绪' : en ? '待配置' : '未启用';
  const stat = _channelStatus[id] || {};
  const dataLine = stat.stored == null
    ? '未产生数据'
    : `库存 ${stat.stored} · 近90天 ${stat.recent||0} · 已评分 ${stat.scored_recent||0}`;
  return `<div class="ch-pick" onclick="showChannelConfig('${id}')">
    <div class="ch-pick-info"><div class="ch-pick-name">${esc(s.name)}</div><div class="ch-pick-desc">${esc(s.description)}</div><div class="pipeline-fresh">${dataLine}</div></div>
    <div class="ch-pick-right"><span class="badge ${status}">${badge}</span><span class="ch-arrow">›</span></div>
  </div>`;
}

// ══ Channel config — Step 2: detail (增删改查) ══
function showChannelConfig(chId) {
  const s = _schema[chId], cfg = _cfgs[chId] || {}, en = cfg.enabled ?? false;
  let html = `<div class="detail-header"><button class="btn-back" onclick="showChannelPicker()">‹</button><div class="detail-title">${esc(s.name)}</div></div>`;
  html += renderChannelPipeline(chId, s);
  html += s.fields.map(f => renderField(chId, f, cfg[f.key] || f.default || '')).join('');
  if (chId === 'telegram') html += tgAccountsSection();
  html += `<div class="ch-footer-bar">
    <label class="toggle"><input type="checkbox" id="en-${chId}" ${en?'checked':''}><div class="toggle-track"></div><span class="toggle-label">启用</span></label>
    <div style="display:flex;align-items:center;gap:8px">
      <span class="toast" id="toast-${chId}"></span>
      <button class="btn-sm btn-danger" onclick="resetChannel('${chId}')">重置</button>
      <button class="btn-save" onclick="saveChannel('${chId}')">保存</button>
    </div>
  </div>`;
  document.getElementById('config-body').innerHTML = html;
  if (chId === 'telegram') setTimeout(loadTgAccounts, 50);
}

function renderChannelPipeline(chId, s) {
  const steps = s.pipeline || ['渠道原始数据','标准化','去重入库','统一规则','页面展示'];
  const flow = steps.map((step, i) => `${i?'<span class="pipeline-arrow">→</span>':''}<span class="pipeline-step">${esc(step)}</span>`).join('');
  const stat = _channelStatus[chId] || {};
  const latest = stat.latest_posted_at ? new Date(stat.latest_posted_at).toLocaleString('zh-CN') : '无';
  const synced = stat.last_synced_at ? new Date(stat.last_synced_at).toLocaleString('zh-CN') : '从未同步';
  return `<div class="pipeline-card"><div class="pipeline-title">数据处理白盒</div><div class="pipeline-flow">${flow}</div>
    <div class="pipeline-stats"><div class="pipeline-stat"><b>${stat.stored||0}</b><span>原始库存</span></div><div class="pipeline-stat"><b>${stat.recent||0}</b><span>近90天</span></div><div class="pipeline-stat"><b>${stat.scored_recent||0}</b><span>已评分可筛</span></div></div>
    <div class="pipeline-fresh">库内最新发布时间：${esc(latest)}<br>本库最后同步：${esc(synced)}</div></div>`;
}

function renderField(chId, f, val) {
  const id = `f-${chId}-${f.key}`, req = f.required ? '<span class="req">*</span>' : '';
  let inp;
  if (f.type === 'textarea') inp = `<textarea id="${id}" placeholder="${esc(f.placeholder||'')}" rows="3">${esc(val)}</textarea>`;
  else if (f.type === 'select') inp = `<select id="${id}">${(f.options||[]).map(o=>`<option ${o===val?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
  else if (f.type === 'password') inp = `<input type="password" id="${id}" value="${esc(val)}" placeholder="${esc(f.placeholder||'')}">`;
  else inp = `<input type="text" id="${id}" value="${esc(val)}" placeholder="${esc(f.placeholder||'')}">`;
  return `<div class="field-group"><div class="field-label">${esc(f.label)} ${req}</div>${inp}${f.help?`<div class="field-help">${esc(f.help)}</div>`:''}</div>`;
}

async function saveChannel(chId) {
  const toast = document.getElementById(`toast-${chId}`);
  const payload = { channel: chId, enabled: document.getElementById(`en-${chId}`).checked };
  document.querySelectorAll(`[id^="f-${chId}-"]`).forEach(el => { payload[el.id.replace(`f-${chId}-`, '')] = el.value.trim(); });
  try {
    const res = await fetch('/api/channels/config', { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) });
    if (res.ok) { toast.className='toast ok'; toast.textContent='已保存'; loadChannels(); }
    else { const d=await res.json(); toast.className='toast err'; toast.textContent=d.detail||'失败'; }
  } catch(e) { toast.className='toast err'; toast.textContent=e.message; }
}

async function resetChannel(chId) {
  if (!confirm('确定重置该渠道配置？')) return;
  try {
    const res = await fetch(`/api/channels/config/${chId}`, { method: 'DELETE' });
    if (res.ok) { loadChannels(); showChannelPicker(); }
  } catch {}
}

function tgAccountsSection() {
  return `<div class="tg-section">
    <div class="tg-section-title">📱 Telegram 账号</div>
    <div id="tg-list"></div>
    <div class="add-acct-form">
      <input type="text" id="tg-label" placeholder="备注名">
      <input type="text" id="tg-phone" placeholder="+66...">
      <input type="text" id="tg-aid" placeholder="API ID">
      <input type="password" id="tg-ahash" placeholder="API Hash">
      <button class="btn-full" onclick="tgAdd()">添加账号</button>
    </div>
    <div class="toast" id="tg-toast" style="margin-top:8px"></div>
  </div>`;
}

async function loadTgAccounts() {
  const el = document.getElementById('tg-list');
  if (!el) return;
  try {
    const d = await fetch('/api/telegram/accounts').then(r=>r.json());
    if (!d.accounts.length) { el.innerHTML = '<div style="color:var(--text3);font-size:12px;margin-bottom:8px">暂无账号</div>'; return; }
    el.innerHTML = d.accounts.map(a => `
      <div class="acct-row" id="ar-${a.id}">
        <div class="acct-info"><span class="dot ${a.has_session?'g':'r'}"></span><div><div class="acct-name">${esc(a.label)}</div><div class="acct-phone">${esc(a.phone)} ${a.has_session?'· 已登录':''}</div></div></div>
        <div class="acct-btns">
          ${!a.has_session?`<button class="btn-login" onclick="tgToggleLogin(${a.id})">登录</button>`:''}
          <button class="btn-del" onclick="tgDel(${a.id})">删</button>
        </div>
      </div>
      <div id="lb-${a.id}" style="display:none" class="login-box">
        <div class="login-row"><button class="btn-code" onclick="tgSend(${a.id})">发送验证码</button><span class="toast" id="lt-${a.id}"></span></div>
        <div class="login-row" id="cr-${a.id}" style="display:none">
          <input type="text" id="code-${a.id}" placeholder="验证码">
          <input type="password" id="2fa-${a.id}" placeholder="两步验证" style="display:none">
          <button class="btn-code" onclick="tgVerify(${a.id})">验证</button>
        </div>
      </div>
    `).join('');
  } catch(e) { el.innerHTML = `<div style="color:var(--red);font-size:12px">${esc(e.message)}</div>`; }
}

async function tgAdd() {
  const label=v('tg-label'), phone=v('tg-phone'), api_id=v('tg-aid'), api_hash=v('tg-ahash'), t=document.getElementById('tg-toast');
  if (!label||!phone||!api_id||!api_hash){t.className='toast err';t.textContent='请填完所有字段';return;}
  try {
    const d = await fetch('/api/telegram/accounts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({label,phone,api_id,api_hash})}).then(r=>r.json());
    if (d.ok){t.className='toast ok';t.textContent=d.message;['tg-label','tg-phone','tg-aid','tg-ahash'].forEach(i=>document.getElementById(i).value='');loadTgAccounts();}
    else{t.className='toast err';t.textContent=d.detail||'失败';}
  }catch(e){t.className='toast err';t.textContent=e.message;}
}

async function tgDel(id){if(!confirm('确定删除？'))return;await fetch(`/api/telegram/accounts/${id}`,{method:'DELETE'});loadTgAccounts();}
function tgToggleLogin(id){const el=document.getElementById(`lb-${id}`);el.style.display=el.style.display==='none'?'block':'none';}

async function tgSend(id){
  const t=document.getElementById(`lt-${id}`);t.textContent='发送中...';
  try{const d=await fetch(`/api/telegram/accounts/${id}/send-code`,{method:'POST'}).then(r=>r.json());
    if(d.ok){t.className='toast ok';t.textContent=d.message;document.getElementById(`cr-${id}`).style.display='flex';}
    else{t.className='toast err';t.textContent=d.detail||'失败';}
  }catch(e){t.className='toast err';t.textContent=e.message;}
}

async function tgVerify(id){
  const code=v(`code-${id}`), pw=v(`2fa-${id}`), t=document.getElementById(`lt-${id}`);
  if(!code){t.className='toast err';t.textContent='请输入验证码';return;}
  try{const d=await fetch(`/api/telegram/accounts/${id}/verify-code`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,password:pw})}).then(r=>r.json());
    if(d.ok){t.className='toast ok';t.textContent='登录成功';loadTgAccounts();}
    else if(d.need_2fa){document.getElementById(`2fa-${id}`).style.display='block';t.className='toast err';t.textContent='需要两步验证密码';}
    else{t.className='toast err';t.textContent=d.detail||'失败';}
  }catch(e){t.className='toast err';t.textContent=e.message;}
}

const drillState = { q: '', results: [], nextToken: '', loading: false, searched: false };

function renderDrill() {
  if (drillState.searched) { renderDrillResults(); return; }
  const el = document.getElementById('drill-body');
  const note = `<div class="pane">
    <h4>光看视频不够</h4>
    <div class="data-sub">视频用来熟悉术语和节奏，正式面试前一定要上真人对练——
    <a href="https://www.pramp.com" target="_blank">Pramp</a>（免费 peer-to-peer）或
    <a href="https://interviewing.io" target="_blank">interviewing.io</a>（付费，真实工程师 + 录像反馈）。</div>
  </div>`;
  let n = 0;
  el.innerHTML = note + `<div class="section-label">编辑精选 · 50 条已核实</div>` + DRILL_GROUPS.map(g => `
    <div class="section-label">${esc(g.title)}</div>
    ${g.items.map(v => drillRow(v, ++n)).join('')}
  `).join('') + `<div class="section-label">搜关键词，实时拉 YouTube 结果 ↑</div>`;
}

function drillPreset(q) {
  document.getElementById('drill-q').value = q;
  drillSearch(true);
}

async function drillSearch(reset) {
  const q = document.getElementById('drill-q').value.trim();
  if (!q) return;
  if (reset) { drillState.q = q; drillState.results = []; drillState.nextToken = ''; drillState.searched = true; }
  if (drillState.loading) return;
  drillState.loading = true;
  const el = document.getElementById('drill-body');
  if (reset) el.innerHTML = '<div class="center-spin"><div class="spin"></div></div>';
  try {
    const params = new URLSearchParams({ q: drillState.q, max_results: '20' });
    if (drillState.nextToken) params.set('page_token', drillState.nextToken);
    const res = await fetch(`/api/drill/search?${params}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || `HTTP ${res.status}`);
    drillState.results = drillState.results.concat(data.videos || []);
    drillState.nextToken = data.next_page_token || '';
    renderDrillResults();
  } catch (e) {
    el.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  } finally {
    drillState.loading = false;
  }
}

function renderDrillResults() {
  const el = document.getElementById('drill-body');
  const list = drillState.results;
  const rows = list.length
    ? list.map((v, i) => drillRow({ id: v.id, title: v.title, channel: v.channel, tags: [] }, i + 1)).join('')
    : '<div class="empty">没搜到，换个关键词试试</div>';
  const more = drillState.nextToken
    ? `<button class="btn-sm btn-ghost" style="width:100%;margin-top:4px" onclick="drillSearch(false)">加载更多</button>`
    : (list.length ? '<div class="empty" style="padding:16px">到底了</div>' : '');
  el.innerHTML = `<div class="list-head"><div class="list-title">「${esc(drillState.q)}」搜索结果 · ${list.length} 条</div>
    <div class="latency" style="cursor:pointer" onclick="drillState.searched=false;renderDrill()">‹ 回到精选</div></div>${rows}${more}`;
}

function drillRow(v, idx) {
  const tags = (v.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join('');
  const hasMatch = v.match !== undefined && v.match !== null;
  const matchColor = v.match >= 85 ? 'var(--green)' : v.match >= 65 ? 'var(--indigo)' : 'var(--text3)';
  return `<div class="card" id="drill-${v.id}">
    <div class="data-head">
      <div class="data-title">${idx ? `<span style="color:var(--text3);font-variant-numeric:tabular-nums">#${idx}</span> ` : ''}${esc(v.title)}</div>
      <div class="data-badges">
        ${hasMatch ? `<span class="data-badge" style="color:${matchColor};border-color:${matchColor}" title="跟简历技术栈/定位的匹配度，本机 Claude 评估">匹配 ${v.match}%</span>` : ''}
        ${v.channel ? `<span class="data-badge">${esc(v.channel)}</span>` : ''}
      </div>
    </div>
    ${tags ? `<div class="tags">${tags}</div>` : ''}
    <div id="player-${v.id}"></div>
    <div class="row-actions">
      <button class="act" onclick="toggleDrillPlay('${v.id}', this)">▶ 播放</button>
      <a class="act apply" href="https://www.youtube.com/watch?v=${v.id}" target="_blank">YouTube 打开 →</a>
    </div>
  </div>`;
}

function toggleDrillPlay(id, btn) {
  const holder = document.getElementById(`player-${id}`);
  if (holder.innerHTML) {
    holder.innerHTML = '';
    btn.textContent = '▶ 播放';
    return;
  }
  holder.innerHTML = `<iframe width="100%" height="200" style="border-radius:12px;margin:2px 0 10px;display:block" src="https://www.youtube-nocookie.com/embed/${id}" title="video" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
  btn.textContent = '▲ 收起';
}

// ══ Helpers ══
function v(id){return document.getElementById(id)?.value?.trim()||'';}
function esc(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML;}
