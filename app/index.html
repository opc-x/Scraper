<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Scraper">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Scraper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

/* ══════════════════════════════════════════
   设计令牌 —— 深色卡片系统，圆角 + 柔光阴影 + 弱饱和强调色
   ══════════════════════════════════════════ */
:root {
  --bg: #0b0c0f;
  --bg-elevated: #131519;
  --bg2: #16181d;
  --bg3: #1e2128;
  --bg-hover: #22262e;
  --border: rgba(255,255,255,0.07);
  --border-strong: rgba(255,255,255,0.12);
  --text: #eef0f3;
  --text2: #9096a1;
  --text3: #5b616e;

  --green: #34d399;
  --green-soft: rgba(52,211,153,0.14);
  --green-border: rgba(52,211,153,0.3);
  --indigo: #818cf8;
  --indigo-soft: rgba(129,140,248,0.14);
  --indigo-border: rgba(129,140,248,0.3);
  --amber: #fbbf24;
  --amber-soft: rgba(251,191,36,0.14);
  --amber-border: rgba(251,191,36,0.3);
  --red: #fb7185;
  --red-soft: rgba(251,113,133,0.14);
  --red-border: rgba(251,113,133,0.3);
  --blue: #38bdf8;
  --blue-soft: rgba(56,189,248,0.14);

  --radius-sm: 10px;
  --radius: 18px;
  --radius-lg: 22px;
  --radius-pill: 999px;
  --shadow-card: 0 1px 2px rgba(0,0,0,0.4), 0 8px 24px -12px rgba(0,0,0,0.55);
  --shadow-pop: 0 4px 10px -4px rgba(0,0,0,0.5);
  --nav-h: 68px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}

html, body {
  height: 100%;
  background:
    radial-gradient(1200px 600px at 15% -10%, rgba(52,211,153,0.05), transparent 55%),
    radial-gradient(900px 500px at 100% 0%, rgba(129,140,248,0.045), transparent 50%),
    var(--bg);
  color: var(--text);
  font-family: 'Inter', -apple-system, 'PingFang SC', 'SF Pro', sans-serif;
  font-feature-settings: 'tnum' 1;
  -webkit-font-smoothing: antialiased;
}

::selection { background: var(--green-soft); color: var(--text); }

/* ── Layout ── */
.screen { display: none; flex-direction: column; height: 100dvh; overflow: hidden; }
.screen.active { display: flex; animation: fade-in 0.25s var(--ease); }
@keyframes fade-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
.screen-body { flex: 1; overflow-y: auto; padding: 4px 18px calc(var(--nav-h) + var(--safe-bottom) + 20px); }
.screen-body::-webkit-scrollbar { display: none; }

/* ── Top bar ── */
.topbar { padding: 16px 18px 14px; padding-top: calc(env(safe-area-inset-top, 12px) + 14px); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.topbar-title { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 23px; font-weight: 800; letter-spacing: -0.02em; }
.topbar-title span { color: var(--green); }
.topbar-sub { font-size: 12.5px; color: var(--text3); margin-top: 3px; font-weight: 500; }

/* ── Bottom nav ── */
.bottom-nav {
  position: fixed; bottom: 10px; left: 12px; right: 12px;
  height: var(--nav-h);
  padding-bottom: 0;
  margin-bottom: var(--safe-bottom);
  background: rgba(19,21,25,0.78);
  backdrop-filter: blur(24px) saturate(160%);
  -webkit-backdrop-filter: blur(24px) saturate(160%);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-lg);
  display: flex;
  z-index: 50;
  box-shadow: var(--shadow-card);
}
.nav-item {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  cursor: pointer; color: var(--text3); border: none; background: none; position: relative;
  transition: color 0.2s var(--ease);
  margin: 7px 5px; border-radius: var(--radius);
}
.nav-item.active { color: var(--green); background: var(--green-soft); }
.nav-icon { font-size: 19px; line-height: 1; filter: grayscale(0.3); }
.nav-item.active .nav-icon { filter: none; }
.nav-label { font-size: 10.5px; font-weight: 600; letter-spacing: 0.2px; }

/* ── Cards / inputs ── */
.card { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 10px; box-shadow: var(--shadow-card); }
.card:last-child { margin-bottom: 0; }
.search-card { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; box-shadow: var(--shadow-card); }
.search-row { display: flex; gap: 8px; margin-bottom: 8px; }
.search-row:last-child { margin-bottom: 0; }
input, select, textarea {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 11px 14px;
  color: var(--text);
  font-size: 14.5px;
  flex: 1;
  outline: none;
  font-family: inherit;
  transition: border-color 0.15s var(--ease), background 0.15s var(--ease);
  -webkit-appearance: none;
  width: 100%;
}
input::placeholder, textarea::placeholder { color: var(--text3); }
input:focus, select:focus, textarea:focus { border-color: var(--green-border); background: var(--bg-hover); }
select { cursor: pointer; }
.btn-fire {
  background: var(--green);
  color: #06251a;
  border: none;
  border-radius: var(--radius-sm);
  padding: 11px 20px;
  font-size: 14.5px;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
  transition: transform 0.12s var(--ease), opacity 0.15s var(--ease), filter 0.15s;
}
.btn-fire:hover { filter: brightness(1.08); }
.btn-fire:active { transform: scale(0.97); }
.btn-fire:disabled { opacity: 0.4; }

/* ── Data row (scraped record) ── */
.data-row { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow-card); transition: border-color 0.2s var(--ease), transform 0.2s var(--ease); }
.data-row:hover { border-color: var(--border-strong); }
.data-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; gap: 10px; }
.data-title { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15.5px; font-weight: 700; line-height: 1.3; flex: 1; letter-spacing: -0.01em; }
.data-title a { text-decoration: none; }
.data-title a:hover { text-decoration: underline; text-decoration-color: var(--green-border); }
.data-badge { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: var(--radius-pill); background: var(--bg3); color: var(--text2); white-space: nowrap; border: 1px solid var(--border); letter-spacing: 0.1px; }
.data-sub { font-size: 12.5px; color: var(--text2); margin-bottom: 8px; line-height: 1.55; }
.data-badges { display: flex; gap: 6px; flex-shrink: 0; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.tag { font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: var(--radius-pill); background: var(--indigo-soft); color: var(--indigo); border: 1px solid var(--indigo-border); white-space: nowrap; }
.data-actions { display: flex; gap: 8px; justify-content: flex-end; align-items: center; margin-top: 10px; padding-top: 12px; border-top: 1px solid var(--border); }
.btn-toggle { padding: 6px 13px; border-radius: var(--radius-pill); font-size: 11.5px; font-weight: 600; cursor: pointer; background: var(--bg3); color: var(--text2); border: 1px solid var(--border); margin-right: auto; transition: all 0.15s var(--ease); }
.btn-toggle:hover { border-color: var(--border-strong); color: var(--text); }
.btn-toggle.active { background: var(--indigo-soft); color: var(--indigo); border-color: var(--indigo-border); }
.btn-sm { padding: 7px 15px; border-radius: var(--radius-sm); font-size: 12px; font-weight: 600; cursor: pointer; border: none; transition: filter 0.15s, transform 0.12s var(--ease); }
.btn-sm:active { transform: scale(0.96); }
.btn-ghost { background: var(--bg3); color: var(--text2); border: 1px solid var(--border); }
.btn-ghost:hover { color: var(--text); border-color: var(--border-strong); }
.btn-danger { background: var(--red-soft); color: var(--red); border: 1px solid var(--red-border); }
.btn-danger:hover { filter: brightness(1.15); }

/* ── Empty / loading ── */
.empty { text-align: center; color: var(--text3); padding: 60px 20px; font-size: 13.5px; font-weight: 500; }
.spin { display: inline-block; width: 22px; height: 22px; border: 2.5px solid var(--border); border-top-color: var(--green); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 40px auto; }
@keyframes spin { to { transform: rotate(360deg); } }
.center-spin { display: flex; justify-content: center; padding: 40px 0; }

/* ── Title effect ── */
.title-fx { background: linear-gradient(135deg, var(--green), #67e8f9); -webkit-background-clip: text; background-clip: text; color: transparent; }

/* ── Channel picker (二级手风琴：一级类目=板块，点击展开二级渠道列表) ── */
.board-section { margin-bottom: 8px; }
.board-section:last-child { margin-bottom: 0; }
.board-title { font-size: 13px; font-weight: 700; color: var(--text); letter-spacing: 0.2px; padding: 13px 4px; display: flex; align-items: baseline; gap: 8px; cursor: pointer; user-select: none; border-bottom: 1px solid var(--border); transition: opacity 0.15s; }
.board-title:hover { opacity: 0.8; }
.board-arrow { color: var(--green); font-size: 10px; width: 10px; display: inline-block; transition: transform 0.2s var(--ease); }
.board-desc { font-size: 11px; font-weight: 500; color: var(--text3); }
.board-count { margin-left: auto; font-size: 10.5px; font-weight: 700; color: var(--text2); background: var(--bg3); padding: 2px 9px; border-radius: var(--radius-pill); border: 1px solid var(--border); }
.board-body { padding-top: 10px; }
.ch-pick { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: all 0.15s var(--ease); box-shadow: var(--shadow-card); }
.ch-pick:hover { border-color: var(--border-strong); background: var(--bg-hover); }
.ch-pick:active { transform: scale(0.99); }
.ch-pick-info { flex: 1; }
.ch-pick-name { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15.5px; font-weight: 700; margin-bottom: 3px; letter-spacing: -0.01em; }
.ch-pick-desc { font-size: 12px; color: var(--text3); line-height: 1.4; }
.ch-pick-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.badge { font-size: 10.5px; padding: 4px 10px; border-radius: var(--radius-pill); font-weight: 700; border: 1px solid transparent; }
.badge.active { background: var(--green-soft); color: var(--green); border-color: var(--green-border); }
.badge.missing { background: var(--amber-soft); color: var(--amber); border-color: var(--amber-border); }
.badge.off { background: var(--bg3); color: var(--text3); border-color: var(--border); }
.ch-arrow { color: var(--text3); font-size: 17px; }

/* ── Channel detail ── */
.detail-header { display: flex; align-items: center; gap: 6px; margin-bottom: 18px; }
.btn-back { background: var(--bg-elevated); border: 1px solid var(--border); color: var(--text2); font-size: 19px; cursor: pointer; padding: 6px 12px; border-radius: var(--radius-pill); line-height: 1; transition: all 0.15s; }
.btn-back:hover { color: var(--text); border-color: var(--border-strong); }
.detail-title { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
.field-group { margin-bottom: 16px; }
.field-label { font-size: 12px; font-weight: 600; color: var(--text2); margin-bottom: 7px; display: flex; align-items: center; gap: 4px; text-transform: uppercase; letter-spacing: 0.4px; }
.field-label .req { color: var(--red); }
.field-help { font-size: 11.5px; color: var(--text3); margin-top: 5px; line-height: 1.5; }
.ch-footer-bar { display: flex; justify-content: space-between; align-items: center; padding-top: 18px; margin-top: 18px; border-top: 1px solid var(--border); }
.toggle { display: flex; align-items: center; gap: 9px; cursor: pointer; }
.toggle input { display: none; }
.toggle-track { width: 42px; height: 25px; background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius-pill); position: relative; transition: background 0.2s var(--ease); }
.toggle-track::after { content: ''; position: absolute; width: 19px; height: 19px; background: var(--text3); border-radius: 50%; top: 2px; left: 2px; transition: all 0.2s var(--ease); }
.toggle input:checked + .toggle-track { background: var(--green); border-color: var(--green); }
.toggle input:checked + .toggle-track::after { left: 20px; background: #06251a; }
.toggle-label { font-size: 13.5px; font-weight: 600; color: var(--text2); }
.btn-save { background: var(--green); color: #06251a; border: none; border-radius: var(--radius-sm); padding: 10px 22px; font-size: 13.5px; font-weight: 700; cursor: pointer; transition: filter 0.15s, transform 0.12s var(--ease); }
.btn-save:hover { filter: brightness(1.08); }
.btn-save:active { transform: scale(0.97); }
.toast { font-size: 12px; font-weight: 600; }
.toast.ok { color: var(--green); }
.toast.err { color: var(--red); }

/* ── Telegram accounts ── */
.tg-section { background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-top: 18px; }
.tg-section-title { font-size: 13px; font-weight: 700; color: var(--text2); margin-bottom: 14px; }
.acct-row { display: flex; justify-content: space-between; align-items: center; padding: 11px 12px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-sm); margin-bottom: 8px; }
.acct-info { display: flex; align-items: center; gap: 9px; font-size: 13px; }
.acct-name { font-weight: 700; }
.acct-phone { color: var(--text3); font-size: 12px; }
.acct-btns { display: flex; gap: 6px; }
.btn-login { background: var(--blue-soft); color: var(--blue); border: 1px solid rgba(56,189,248,0.3); border-radius: var(--radius-sm); padding: 6px 12px; font-size: 12px; font-weight: 700; cursor: pointer; }
.btn-del { background: var(--red-soft); color: var(--red); border: 1px solid var(--red-border); border-radius: var(--radius-sm); padding: 6px 11px; font-size: 12px; font-weight: 600; cursor: pointer; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 0 3px transparent; }
.dot.g { background: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }
.dot.r { background: var(--red); box-shadow: 0 0 0 3px var(--red-soft); }
.add-acct-form { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }
.add-acct-form input { font-size: 13px; padding: 9px 12px; }
.add-acct-form .btn-full { grid-column: 1/-1; }
.btn-full { width: 100%; background: var(--blue); color: #05202e; border: none; border-radius: var(--radius-sm); padding: 10px; font-size: 13.5px; font-weight: 700; cursor: pointer; transition: filter 0.15s; }
.btn-full:hover { filter: brightness(1.08); }
.login-box { margin-top: 8px; margin-bottom: 8px; padding: 11px; background: var(--bg-elevated); border-radius: var(--radius-sm); border: 1px solid var(--border); }
.login-row { display: flex; gap: 8px; margin-bottom: 8px; }
.login-row:last-child { margin-bottom: 0; }
.login-row input { font-size: 13px; padding: 9px 12px; }
.btn-code { background: var(--blue-soft); color: var(--blue); border: 1px solid rgba(56,189,248,0.3); border-radius: var(--radius-sm); padding: 9px 14px; font-size: 12.5px; font-weight: 700; cursor: pointer; white-space: nowrap; }
</style>
</head>
<body>

<!-- ══ Screen: 渠道配置 ══ -->
<div class="screen active" id="screen-config">
  <div class="topbar">
    <div class="topbar-title" id="config-title">渠道配置</div>
  </div>
  <div class="screen-body" id="config-body">
    <div class="center-spin"><div class="spin"></div></div>
  </div>
</div>

<!-- ══ Screen: 数据 ══ -->
<div class="screen" id="screen-data">
  <div class="topbar">
    <div>
      <div class="topbar-title"><span>Scraper</span></div>
      <div class="topbar-sub">选渠道 → 看 AI 挖到的账号、标签、置信度</div>
    </div>
  </div>
  <div class="screen-body">
    <div class="field-label" style="margin-bottom:6px">① 选择渠道</div>
    <div class="search-row" style="margin-bottom:10px">
      <select id="data-filter" style="flex:1" onchange="onChannelFilterChange()"></select>
      <button class="btn-sm btn-ghost" onclick="loadAccounts()" style="flex-shrink:0">刷新</button>
    </div>

    <div class="search-row" style="margin-bottom:14px">
      <select id="topic-filter" style="flex:1" onchange="loadAccounts()">
        <option value="">全部主题</option>
      </select>
    </div>

    <div id="account-list"><div class="empty">选择渠道后自动加载</div></div>
  </div>
</div>

<!-- ══ Screen: 接口 ══ -->
<div class="screen" id="screen-api">
  <div class="topbar">
    <div class="topbar-title">接口</div>
  </div>
  <div class="screen-body" style="padding:0">
    <iframe id="api-frame" src="/docs" style="width:100%;height:calc(100dvh - var(--nav-h) - var(--safe-bottom));border:none;background:#fff"></iframe>
  </div>
</div>

<!-- ══ Bottom Nav ══ -->
<nav class="bottom-nav">
  <button class="nav-item active" id="nav-config" onclick="switchTab('config')">
    <span class="nav-icon">📡</span>
    <span class="nav-label">渠道配置</span>
  </button>
  <button class="nav-item" id="nav-data" onclick="switchTab('data')">
    <span class="nav-icon">🗄️</span>
    <span class="nav-label">数据</span>
  </button>
  <button class="nav-item" id="nav-api" onclick="switchTab('api')">
    <span class="nav-icon">🔌</span>
    <span class="nav-label">接口</span>
  </button>
</nav>

<script>
// ══ PWA ══
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');

// ══ Tab switching ══
const TABS = ['config', 'data', 'api'];
function switchTab(tab) {
  TABS.forEach(t => {
    document.getElementById(`screen-${t}`).classList.toggle('active', t === tab);
    document.getElementById(`nav-${t}`).classList.toggle('active', t === tab);
  });
  if (tab === 'config') showChannelPicker();
  if (tab === 'data') loadAccounts();
}

// ══ Channel select init ══
let _schema = null, _cfgs = null;

async function loadChannels() {
  try {
    const res = await fetch('/api/channels');
    const data = await res.json();
    const filterSel = document.getElementById('data-filter');
    filterSel.innerHTML = '<option value="">全部渠道</option>' +
      data.channels.map(ch => `<option value="${esc(ch.id)}">${esc(ch.name)}</option>`).join('');
  } catch {}
}
loadChannels();
showChannelPicker();

// ══ mined_accounts 查/删（渠道下 AI 挖到的账号 + 标签 + 置信度） ══
async function onChannelFilterChange() {
  await loadTopics();
  loadAccounts();
}

async function loadTopics() {
  const channel = document.getElementById('data-filter').value;
  const topicSel = document.getElementById('topic-filter');
  try {
    const qs = channel ? `?channel=${encodeURIComponent(channel)}` : '';
    const res = await fetch(`/api/accounts/topics${qs}`);
    const data = await res.json();
    topicSel.innerHTML = '<option value="">全部主题</option>' +
      data.topics.map(t => `<option value="${esc(t.topic)}">${esc(t.topic)}</option>`).join('');
  } catch {}
}

async function loadAccounts() {
  const el = document.getElementById('account-list');
  el.innerHTML = '<div class="center-spin"><div class="spin"></div></div>';
  const channel = document.getElementById('data-filter').value;
  const topic = document.getElementById('topic-filter').value;
  try {
    const params = new URLSearchParams({ limit: '200' });
    if (channel) params.set('channel', channel);
    if (topic) params.set('topic', topic);
    const res = await fetch(`/api/accounts?${params}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || `HTTP ${res.status}`);
    el.innerHTML = data.accounts.length
      ? data.accounts.map(accountRow).join('')
      : '<div class="empty">mined_accounts 表暂无数据</div>';
  } catch (e) { el.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

function accountRow(a) {
  const confColor = a.confidence >= 70 ? 'var(--green)' : 'var(--text3)';
  const valScore = a.value_score ?? 0;
  const valColor = valScore >= 70 ? 'var(--green)' : 'var(--text3)';
  const tags = (a.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join('');
  const bioText = a.bio ? esc(a.bio).replace(/\n/g, '<br>') : '<span style="color:var(--text3)">该账号暂无抓取到的简介</span>';
  const summaryText = a.rationale ? esc(a.rationale) : '<span style="color:var(--text3)">暂无 AI 摘要</span>';
  return `<div class="data-row">
    <div class="data-head">
      <div class="data-title">${a.profile_url ? `<a href="${esc(a.profile_url)}" target="_blank" style="color:inherit">@${esc(a.handle)}</a>` : '@' + esc(a.handle)}</div>
      <div class="data-badges">
        <span class="data-badge" style="color:${confColor};border-color:${confColor}" title="置信度：是否符合主题">置信 ${a.confidence}%</span>
        <span class="data-badge" style="color:${valColor};border-color:${valColor}" title="价值分：内容对我有多大用">价值 ${valScore}%</span>
      </div>
    </div>
    <div class="data-sub">${esc(a.topic)}</div>
    ${tags ? `<div class="tags">${tags}</div>` : ''}
    <div class="data-sub" data-bio="${encodeURIComponent(bioText)}" data-summary="${encodeURIComponent(summaryText)}" data-mode="bio" style="margin-top:6px">${bioText}</div>
    <div class="data-actions">
      <button class="btn-toggle" onclick="toggleAccountView(this)">看 AI 摘要（基于历史发帖）</button>
      <button class="btn-sm btn-danger" onclick="deleteAccount(${a.id}, this)">删除</button>
    </div>
  </div>`;
}

function toggleAccountView(btn) {
  const row = btn.closest('.data-row');
  const content = row.querySelector('[data-bio]');
  const showingBio = content.dataset.mode === 'bio';
  content.innerHTML = decodeURIComponent(showingBio ? content.dataset.summary : content.dataset.bio);
  content.dataset.mode = showingBio ? 'summary' : 'bio';
  btn.textContent = showingBio ? '看账号简介' : '看 AI 摘要（基于历史发帖）';
  btn.classList.toggle('active', showingBio);
}

async function deleteAccount(id, el) {
  if (!confirm('确定删除这个账号？')) return;
  try {
    const res = await fetch(`/api/accounts/${id}`, { method: 'DELETE' });
    if (res.ok) el.closest('.data-row').remove();
  } catch {}
}

// ══ Channel config — Step 1: picker（按板块分组，一个板块对应一个下游 app） ══
let _boards = null;

async function showChannelPicker() {
  document.getElementById('config-title').innerHTML = '<span class="title-fx">渠道配置</span>';
  const body = document.getElementById('config-body');
  body.innerHTML = '<div class="center-spin"><div class="spin"></div></div>';
  try {
    const [sr, cr] = await Promise.all([fetch('/api/channels/schema').then(r=>r.json()), fetch('/api/channels/config').then(r=>r.json())]);
    _schema = sr.schema; _cfgs = cr.channels; _boards = sr.boards || {};

    const byBoard = {};
    Object.entries(_schema).forEach(([id, s]) => {
      const b = s.board || '_';
      (byBoard[b] = byBoard[b] || []).push([id, s]);
    });

    body.innerHTML = Object.entries(_boards).map(([boardId, board]) => {
      const items = byBoard[boardId] || [];
      const list = items.length
        ? items.map(([id, s]) => channelPickRow(id, s)).join('')
        : '<div class="empty" style="padding:20px">暂无渠道</div>';
      return `<div class="board-section">
        <div class="board-title" onclick="toggleBoard('${boardId}')">
          <span class="board-arrow" id="ba-${boardId}">▸</span>
          ${esc(board.name)}<span class="board-desc">${esc(board.desc||'')}</span>
          <span class="board-count">${items.length}</span>
        </div>
        <div class="board-body" id="bb-${boardId}" style="display:none">${list}</div>
      </div>`;
    }).join('');
  } catch (e) { body.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

function toggleBoard(boardId) {
  const bodyEl = document.getElementById(`bb-${boardId}`);
  const arrow = document.getElementById(`ba-${boardId}`);
  const open = bodyEl.style.display !== 'none';
  bodyEl.style.display = open ? 'none' : 'block';
  arrow.textContent = open ? '▸' : '▾';
}

function channelPickRow(id, s) {
  const cfg = _cfgs[id] || {};
  const en = cfg.enabled ?? false;
  const filled = s.fields.filter(f=>f.required).every(f=>!!cfg[f.key]);
  const status = en && filled ? 'active' : en ? 'missing' : 'off';
  const badge = en && filled ? '已就绪' : en ? '待配置' : '未启用';
  return `<div class="ch-pick" onclick="showChannelConfig('${id}')">
    <div class="ch-pick-info"><div class="ch-pick-name">${esc(s.name)}</div><div class="ch-pick-desc">${esc(s.description)}</div></div>
    <div class="ch-pick-right"><span class="badge ${status}">${badge}</span><span class="ch-arrow">›</span></div>
  </div>`;
}

// ══ Channel config — Step 2: detail (增删改查) ══
function showChannelConfig(chId) {
  const s = _schema[chId], cfg = _cfgs[chId] || {}, en = cfg.enabled ?? false;
  document.getElementById('config-title').textContent = s.name;
  let html = `<div class="detail-header"><button class="btn-back" onclick="showChannelPicker()">‹</button><div class="detail-title">${esc(s.name)}</div></div>`;
  html += s.fields.map(f => renderField(chId, f, cfg[f.key] || f.default || '')).join('');
  if (chId === 'telegram') html += tgAccountsSection();
  html += `<div class="ch-footer-bar">
    <label class="toggle"><input type="checkbox" id="en-${chId}" ${en?'checked':''}><div class="toggle-track"></div><span class="toggle-label">启用</span></label>
    <div style="display:flex;align-items:center;gap:8px">
      <span class="toast" id="toast-${chId}"></span>
      <button class="btn-sm btn-danger" onclick="resetChannel('${chId}')">重置</button>
      <button class="btn-save" onclick="saveChannel('${chId}')">保存</button>
    </div>
  </div>`;
  document.getElementById('config-body').innerHTML = html;
  if (chId === 'telegram') setTimeout(loadTgAccounts, 50);
}

function renderField(chId, f, val) {
  const id = `f-${chId}-${f.key}`, req = f.required ? '<span class="req">*</span>' : '';
  let inp;
  if (f.type === 'textarea') inp = `<textarea id="${id}" placeholder="${esc(f.placeholder||'')}" rows="3">${esc(val)}</textarea>`;
  else if (f.type === 'select') inp = `<select id="${id}">${(f.options||[]).map(o=>`<option ${o===val?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
  else if (f.type === 'password') inp = `<input type="password" id="${id}" value="${esc(val)}" placeholder="${esc(f.placeholder||'')}">`;
  else inp = `<input type="text" id="${id}" value="${esc(val)}" placeholder="${esc(f.placeholder||'')}">`;
  return `<div class="field-group"><div class="field-label">${esc(f.label)} ${req}</div>${inp}${f.help?`<div class="field-help">${esc(f.help)}</div>`:''}</div>`;
}

async function saveChannel(chId) {
  const toast = document.getElementById(`toast-${chId}`);
  const payload = { channel: chId, enabled: document.getElementById(`en-${chId}`).checked };
  document.querySelectorAll(`[id^="f-${chId}-"]`).forEach(el => { payload[el.id.replace(`f-${chId}-`, '')] = el.value.trim(); });
  try {
    const res = await fetch('/api/channels/config', { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) });
    if (res.ok) { toast.className='toast ok'; toast.textContent='已保存'; loadChannels(); }
    else { const d=await res.json(); toast.className='toast err'; toast.textContent=d.detail||'失败'; }
  } catch(e) { toast.className='toast err'; toast.textContent=e.message; }
}

async function resetChannel(chId) {
  if (!confirm('确定重置该渠道配置？')) return;
  try {
    const res = await fetch(`/api/channels/config/${chId}`, { method: 'DELETE' });
    if (res.ok) { loadChannels(); showChannelPicker(); }
  } catch {}
}

// ══ Telegram accounts（渠道配置的一部分，增删改查） ══
function tgAccountsSection() {
  return `<div class="tg-section">
    <div class="tg-section-title">📱 Telegram 账号</div>
    <div id="tg-list"></div>
    <div class="add-acct-form">
      <input type="text" id="tg-label" placeholder="备注名">
      <input type="text" id="tg-phone" placeholder="+66...">
      <input type="text" id="tg-aid" placeholder="API ID">
      <input type="password" id="tg-ahash" placeholder="API Hash">
      <button class="btn-full" onclick="tgAdd()">添加账号</button>
    </div>
    <div class="toast" id="tg-toast" style="margin-top:8px"></div>
  </div>`;
}

async function loadTgAccounts() {
  const el = document.getElementById('tg-list');
  if (!el) return;
  try {
    const d = await fetch('/api/telegram/accounts').then(r=>r.json());
    if (!d.accounts.length) { el.innerHTML = '<div style="color:var(--text3);font-size:12px;margin-bottom:8px">暂无账号</div>'; return; }
    el.innerHTML = d.accounts.map(a => `
      <div class="acct-row" id="ar-${a.id}">
        <div class="acct-info"><span class="dot ${a.has_session?'g':'r'}"></span><div><div class="acct-name">${esc(a.label)}</div><div class="acct-phone">${esc(a.phone)} ${a.has_session?'· 已登录':''}</div></div></div>
        <div class="acct-btns">
          ${!a.has_session?`<button class="btn-login" onclick="tgToggleLogin(${a.id})">登录</button>`:''}
          <button class="btn-del" onclick="tgDel(${a.id})">删</button>
        </div>
      </div>
      <div id="lb-${a.id}" style="display:none" class="login-box">
        <div class="login-row"><button class="btn-code" onclick="tgSend(${a.id})">发送验证码</button><span class="toast" id="lt-${a.id}"></span></div>
        <div class="login-row" id="cr-${a.id}" style="display:none">
          <input type="text" id="code-${a.id}" placeholder="验证码">
          <input type="password" id="2fa-${a.id}" placeholder="两步验证" style="display:none">
          <button class="btn-code" onclick="tgVerify(${a.id})">验证</button>
        </div>
      </div>
    `).join('');
  } catch(e) { el.innerHTML = `<div style="color:var(--red);font-size:12px">${esc(e.message)}</div>`; }
}

async function tgAdd() {
  const label=v('tg-label'), phone=v('tg-phone'), api_id=v('tg-aid'), api_hash=v('tg-ahash'), t=document.getElementById('tg-toast');
  if (!label||!phone||!api_id||!api_hash){t.className='toast err';t.textContent='请填完所有字段';return;}
  try {
    const d = await fetch('/api/telegram/accounts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({label,phone,api_id,api_hash})}).then(r=>r.json());
    if (d.ok){t.className='toast ok';t.textContent=d.message;['tg-label','tg-phone','tg-aid','tg-ahash'].forEach(i=>document.getElementById(i).value='');loadTgAccounts();}
    else{t.className='toast err';t.textContent=d.detail||'失败';}
  }catch(e){t.className='toast err';t.textContent=e.message;}
}

async function tgDel(id){if(!confirm('确定删除？'))return;await fetch(`/api/telegram/accounts/${id}`,{method:'DELETE'});loadTgAccounts();}
function tgToggleLogin(id){const el=document.getElementById(`lb-${id}`);el.style.display=el.style.display==='none'?'block':'none';}

async function tgSend(id){
  const t=document.getElementById(`lt-${id}`);t.textContent='发送中...';
  try{const d=await fetch(`/api/telegram/accounts/${id}/send-code`,{method:'POST'}).then(r=>r.json());
    if(d.ok){t.className='toast ok';t.textContent=d.message;document.getElementById(`cr-${id}`).style.display='flex';}
    else{t.className='toast err';t.textContent=d.detail||'失败';}
  }catch(e){t.className='toast err';t.textContent=e.message;}
}

async function tgVerify(id){
  const code=v(`code-${id}`), pw=v(`2fa-${id}`), t=document.getElementById(`lt-${id}`);
  if(!code){t.className='toast err';t.textContent='请输入验证码';return;}
  try{const d=await fetch(`/api/telegram/accounts/${id}/verify-code`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,password:pw})}).then(r=>r.json());
    if(d.ok){t.className='toast ok';t.textContent='登录成功';loadTgAccounts();}
    else if(d.need_2fa){document.getElementById(`2fa-${id}`).style.display='block';t.className='toast err';t.textContent='需要两步验证密码';}
    else{t.className='toast err';t.textContent=d.detail||'失败';}
  }catch(e){t.className='toast err';t.textContent=e.message;}
}

// ══ Helpers ══
function v(id){return document.getElementById(id)?.value?.trim()||'';}
function esc(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML;}
</script>
</body>
</html>
